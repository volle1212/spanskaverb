<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snabbläsare</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/speedreader/style.css">
</head>

<body>
    <div id="display" style="width: 100%;">
        <div id="wordContainer">
            <div id="anchor"></div>
        </div>
    </div>

    <div id="controls">
        <textarea id="textInput"
            placeholder="Klistra in din text här...">Att läsa snabbt handlar om att träna hjärnan att ta in ord på ett effektivt sätt. Genom att presentera ord ett i taget med en fast ankarpunkt kan läshastigheten öka dramatiskt. Detta kallas Rapid Serial Visual Presentation och används av många för att öka sin läshastighet.</textarea>
        <div class="control-row">
            <label>Hastighet:</label>
            <input type="range" id="speedSlider" min="300" max="1000" value="300" step="50">
            <span class="value-display" id="wpmDisplay">300 ord/min</span>
        </div>

        <div class="control-row">
            <label>Textstorlek:</label>
            <input type="range" id="sizeSlider" min="24" max="72" value="48" step="4">
            <span class="value-display" id="sizeDisplay">48px</span>
        </div>

        <div class="control-row">
            <button id="playPauseBtn">Starta</button>
            <button id="resetBtn">Återställ</button>
        </div>
    </div>

    <script>
        const wordContainer = document.getElementById('wordContainer');
        const anchorEl = document.getElementById('anchor');
        const displayEl = document.getElementById('display');
        const textInput = document.getElementById('textInput');
        const speedSlider = document.getElementById('speedSlider');
        const sizeSlider = document.getElementById('sizeSlider');
        const wpmDisplay = document.getElementById('wpmDisplay');
        const sizeDisplay = document.getElementById('sizeDisplay');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const resetBtn = document.getElementById('resetBtn');

        let words = [];
        let currentIndex = 0;
        let intervalId = null;
        let delay = 300;
        let fontSize = 48;
        let letterWidth = 0;

        // Skapa en dold canvas för att mäta bokstavsbredder
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');

        function measureLetterWidth() {
            ctx.font = `${fontSize}px Georgia`;
            // Mät en genomsnittlig bokstav
            letterWidth = ctx.measureText('m').width;
        }

        function findAnchorPoint(word) {
            const len = word.length;
            if (len === 1) return 0;
            if (len === 2 || len === 3) return 1;
            if (len === 4 || len === 5) return 2;
            return Math.floor(len / 2);
        }

        function displayWord(word) {
            // Rensa tidigare bokstäver
            const oldLetters = wordContainer.querySelectorAll('.letter');
            oldLetters.forEach(el => el.remove());

            const anchorIndex = findAnchorPoint(word);
            // Visa ankarbokstaven
            anchorEl.textContent = word[anchorIndex];
            anchorEl.style.fontSize = fontSize + 'px';

            // Visa bokstäver före ankaret
            for (let i = 0; i < anchorIndex; i++) {
                const letter = document.createElement('div');
                letter.className = 'letter';
                letter.textContent = word[i];
                letter.style.fontSize = fontSize + 'px';
                // Placera till vänster om ankaret
                const offset = (anchorIndex - i) * letterWidth;
                letter.style.left = `calc(50% - ${offset}px)`;
                letter.style.transform = 'translateX(-50%)';
                wordContainer.appendChild(letter);
            }

            // Visa bokstäver efter ankaret
            for (let i = anchorIndex + 1; i < word.length; i++) {
                const letter = document.createElement('div');
                letter.className = 'letter';
                letter.textContent = word[i];
                letter.style.fontSize = fontSize + 'px';
                // Placera till höger om ankaret
                const offset = (i - anchorIndex) * letterWidth;
                letter.style.left = `calc(50% + ${offset}px)`;
                letter.style.transform = 'translateX(-50%)';
                wordContainer.appendChild(letter);
            }
        }

        function start() {
            if (intervalId) return;
            if (currentIndex === 0) {
                words = textInput.value.trim().split(/\s+/).filter(w => w.length > 0);
                if (words.length === 0) return;
            }

            measureLetterWidth();
            playPauseBtn.textContent = 'Pausa';
            playPauseBtn.classList.add('active');

            // Enter fullscreen
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            }

            // Start playback after 1 second
            setTimeout(() => {
                intervalId = setInterval(() => {
                    if (currentIndex >= words.length) {
                        stop();
                        return;
                    }

                    displayWord(words[currentIndex]);
                    currentIndex++;
                }, delay);
            }, 1000);
        }

        function pause() {
            if (intervalId) {
                clearInterval(intervalId);
                intervalId = null;
                playPauseBtn.textContent = 'Starta';
                playPauseBtn.classList.remove('active');
            }
        }

        function togglePlayPause() {
            if (intervalId) {
                pause();
            } else {
                start();
            }
        }

        function stop() {
            pause();
            currentIndex = 0;
            anchorEl.textContent = '';
            const oldLetters = wordContainer.querySelectorAll('.letter');
            oldLetters.forEach(el => el.remove());

            // Exit fullscreen
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }

        speedSlider.addEventListener('input', (e) => {
            const wpmValue = parseInt(e.target.value);
            delay = Math.round(60000 / wpmValue);
            wpmDisplay.textContent = `${wpmValue} ord/min`;
            if (intervalId) {
                pause();
                start();
            }
        });

        sizeSlider.addEventListener('input', (e) => {
            fontSize = parseInt(e.target.value);
            anchorEl.style.fontSize = fontSize + 'px';
            const letters = wordContainer.querySelectorAll('.letter');
            letters.forEach(el => el.style.fontSize = fontSize + 'px');
            sizeDisplay.textContent = fontSize + 'px';
            measureLetterWidth();
        });

        playPauseBtn.addEventListener('click', togglePlayPause);
        resetBtn.addEventListener('click', stop);

        // Tangentbordsgenvägar
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                togglePlayPause();
            } else if (e.code === 'Escape') {
                stop();
            }
        });

        // Initial setup
        measureLetterWidth();
        wpmDisplay.textContent = '300 ord/min';
    </script>
</body>

</html>
